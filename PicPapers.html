<script>

for(let i=0;i<(dark?2:5);i++){const r=(.12+rnd()*.35)*Math.min(w,h),x=rnd()*w,y=rnd()*h,c=`hsl(${(hue+rnd()*90)%360},80%,${dark?70:62}%)`,o=(dark?.5:.15+rnd()*.35).toFixed(2);

CATS.slice(1).forEach(c=>{for(let i=0;i<16;i++){const [a,b]=ASP[(rnd()*ASP.length)|0],dark=c==='Dark & AMOLED',hue=(HUE[c]+rnd()*50)|0,name=NOUN[c][i%4]+(i>3?' '+(Math.floor(i/4)+1):''),url=art(a*400,b*400,hue,dark);

function cropDialog(im,u){const N=280;let rot=0,zoom=1,ox=0,oy=0;
modal(`<h2>Crop &amp; rotate</h2><div style="position:relative;width:min(280px,100%);margin:0 auto 12px;aspect-ratio:1"><canvas id="cv" width="${N}" height="${N}" tabindex="0" aria-label="Drag to reposition the photo. Arrow keys also move it." style="width:100%;height:100%;border-radius:16px;background:#000;touch-action:none;cursor:grab;display:block"></canvas><div style="position:absolute;inset:0;border-radius:16px;pointer-events:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.4);background:radial-gradient(circle,transparent 69%,rgba(0,0,0,.55) 70%)"></div></div>
<div class="chips" style="justify-content:center"><button type="button" class="btn" id="rl">↺ Rotate left</button><button type="button" class="btn" id="rr">↻ Rotate right</button></div>
<label>Zoom<input id="zm" type="range" min="1" max="3" step="0.01" value="1"></label><p class="mut" style="font-size:12px">Drag the photo to reposition it. The circle shows what appears as your avatar.</p>
<div style="display:flex;gap:8px"><button type="button" class="btn pri" id="ok">Apply</button><button type="button" class="btn" data-a="close">Cancel</button></div>`,1);
const cv=$('#cv'),cx=cv.getContext('2d'),dims=()=>rot%180?[im.naturalHeight,im.naturalWidth]:[im.naturalWidth,im.naturalHeight];
const clamp=()=>{const [w,h]=dims(),sc=Math.max(N/w,N/h)*zoom,mx=Math.max(0,(w*sc-N)/2),my=Math.max(0,(h*sc-N)/2);ox=Math.max(-mx,Math.min(mx,ox));oy=Math.max(-my,Math.min(my,oy))};
const paint=(c,size)=>{const k=size/N,[w,h]=dims(),sc=Math.max(N/w,N/h)*zoom*k;c.fillStyle='#000';c.fillRect(0,0,size,size);c.save();c.translate(size/2+ox*k,size/2+oy*k);c.rotate(rot*Math.PI/180);c.scale(sc,sc);c.drawImage(im,-im.naturalWidth/2,-im.naturalHeight/2);c.restore()};
const render=()=>{clamp();paint(cx,N)};
$('#rl').onclick=()=>{rot=(rot+270)%360;render()};$('#rr').onclick=()=>{rot=(rot+90)%360;render()};$('#zm').oninput=e=>{zoom=+e.target.value;render()};
let drag=null;cv.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY,ox,oy};cv.setPointerCapture(e.pointerId);cv.style.cursor='grabbing'};

cv.onpointerup=cv.onpointercancel=()=>{drag=null;cv.style.cursor='grab'};
cv.onkeydown=e=>{const d={ArrowLeft:[-10,0],ArrowRight:[10,0],ArrowUp:[0,-10],ArrowDown:[0,10]}[e.key];if(d){e.preventDefault();ox+=d[0];oy+=d[1];render()}};

render();cv.focus()}

addEventListener('load',e=>{if(e.target.tagName==='IMG')e.target.parentNode?.classList.add('ld')},true);
let ct=null,cr=0,px2=0,py2=0;
$('#main').addEventListener('pointermove',e=>{if(e.pointerType!=='mouse')return;const c=e.target.closest('.card');if(!c)return;ct=c;px2=e.clientX;py2=e.clientY;cr||(cr=requestAnimationFrame(()=>{cr=0;const r=ct.getBoundingClientRect();ct.style.setProperty('--tx',(-((px2-r.left)/r.width-.5)*6).toFixed(2)+'%');ct.style.setProperty('--ty',(-((py2-r.top)/r.height-.5)*6).toFixed(2)+'%')}))},{passive:true});
$('#main').addEventListener('pointerout',e=>{const c=e.target.closest?.('.card');if(c&&!c.contains(e.relatedTarget)){c.style.removeProperty('--tx');c.style.removeProperty('--ty')}});
const sp=$('#sp');let px=0,py=0,tk=0;addEventListener('pointermove',e=>{px=e.clientX;py=e.clientY;tk||(tk=requestAnimationFrame(()=>{sp.style.transform=`translate(${px-200}px,${py-200}px)`;tk=0}))},{passive:true});
